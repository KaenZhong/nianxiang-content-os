<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="228" viewBox="0 0 1120 228" role="img" aria-labelledby="title desc">
<title id="title">念响OS共创流程</title>
<desc id="desc">提供真实素材，阿响判断价值与切口，你选择方向，共创朋友圈或口播，按你的授权保存与积累。</desc>
<rect width="1120" height="228" rx="16" fill="#f5f8fa"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="28" y="35" font-size="15" font-weight="600" fill="#43566b">从真实素材出发，逐步积累自己的内容资产</text>
<rect x="28" y="59" width="192" height="137" rx="12" fill="#ffffff" stroke="#dbe3eb"/>
<text x="45" y="92" font-size="14" font-weight="700" fill="#278268">01</text>
<text x="45" y="126" font-size="17" font-weight="600" fill="#1d2f43">提供真实素材</text>
<text x="45" y="158" font-size="13" fill="#5d6e80">经历、问答、录音转写</text>
<path d="M 227 127 h 12 m -5 -5 5 5 -5 5" fill="none" stroke="#91a4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="246" y="59" width="192" height="137" rx="12" fill="#ffffff" stroke="#dbe3eb"/>
<text x="263" y="92" font-size="14" font-weight="700" fill="#278268">02</text>
<text x="263" y="126" font-size="17" font-weight="600" fill="#1d2f43">找到值得讲的切口</text>
<text x="263" y="158" font-size="13" fill="#5d6e80">阿响分析，你来判断</text>
<path d="M 445 127 h 12 m -5 -5 5 5 -5 5" fill="none" stroke="#91a4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="464" y="59" width="192" height="137" rx="12" fill="#ffffff" stroke="#dbe3eb"/>
<text x="481" y="92" font-size="14" font-weight="700" fill="#278268">03</text>
<text x="481" y="126" font-size="17" font-weight="600" fill="#1d2f43">选择这次的方向</text>
<text x="481" y="158" font-size="13" fill="#5d6e80">保留你的立场与边界</text>
<path d="M 663 127 h 12 m -5 -5 5 5 -5 5" fill="none" stroke="#91a4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="682" y="59" width="192" height="137" rx="12" fill="#ffffff" stroke="#dbe3eb"/>
<text x="699" y="92" font-size="14" font-weight="700" fill="#278268">04</text>
<text x="699" y="126" font-size="17" font-weight="600" fill="#1d2f43">一起把内容写好</text>
<text x="699" y="158" font-size="13" fill="#5d6e80">朋友圈、口播与改稿</text>
<path d="M 881 127 h 12 m -5 -5 5 5 -5 5" fill="none" stroke="#91a4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="900" y="59" width="192" height="137" rx="12" fill="#e5f4ef" stroke="#9acdbb"/>
<text x="917" y="92" font-size="14" font-weight="700" fill="#278268">05</text>
<text x="917" y="126" font-size="17" font-weight="600" fill="#1d2f43">保存并继续积累</text>
<text x="917" y="158" font-size="13" fill="#5d6e80">按你的具体授权执行</text>
</g>
</svg>
