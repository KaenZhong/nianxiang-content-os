<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="228" viewBox="0 0 1120 228" role="img" aria-labelledby="title desc">
<title id="title">念响OS共创流程</title>
<desc id="desc">提供真实素材，阿响判断价值与切口，你选择方向，共创朋友圈或口播，按你的授权保存与积累。</desc>
<rect width="1120" height="228" rx="16" fill="#fffbea"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="28" y="35" font-size="15" font-weight="600" fill="#343126">从真实素材出发，逐步积累自己的内容资产</text>
<rect x="28" y="59" width="192" height="137" rx="12" fill="#ffffff" stroke="#eadfaa"/>
<rect x="40" y="74" width="32" height="25" rx="6" fill="#ffd400"/>
<text x="45" y="92" font-size="14" font-weight="700" fill="#24221c">01</text>
<text x="45" y="126" font-size="17" font-weight="600" fill="#24221c">提供真实素材</text>
<text x="45" y="158" font-size="13" fill="#625b45">经历、问答、录音转写</text>
<path d="M 227 127 h 12 m -5 -5 5 5 -5 5" fill="none" stroke="#a59242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="246" y="59" width="192" height="137" rx="12" fill="#ffffff" stroke="#eadfaa"/>
<rect x="258" y="74" width="32" height="25" rx="6" fill="#ffd400"/>
<text x="263" y="92" font-size="14" font-weight="700" fill="#24221c">02</text>
<text x="263" y="126" font-size="17" font-weight="600" fill="#24221c">找到值得讲的切口</text>
<text x="263" y="158" font-size="13" fill="#625b45">阿响分析，你来判断</text>
<path d="M 445 127 h 12 m -5 -5 5 5 -5 5" fill="none" stroke="#a59242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="464" y="59" width="192" height="137" rx="12" fill="#ffffff" stroke="#eadfaa"/>
<rect x="476" y="74" width="32" height="25" rx="6" fill="#ffd400"/>
<text x="481" y="92" font-size="14" font-weight="700" fill="#24221c">03</text>
<text x="481" y="126" font-size="17" font-weight="600" fill="#24221c">选择这次的方向</text>
<text x="481" y="158" font-size="13" fill="#625b45">保留你的立场与边界</text>
<path d="M 663 127 h 12 m -5 -5 5 5 -5 5" fill="none" stroke="#a59242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="682" y="59" width="192" height="137" rx="12" fill="#ffffff" stroke="#eadfaa"/>
<rect x="694" y="74" width="32" height="25" rx="6" fill="#ffd400"/>
<text x="699" y="92" font-size="14" font-weight="700" fill="#24221c">04</text>
<text x="699" y="126" font-size="17" font-weight="600" fill="#24221c">一起把内容写好</text>
<text x="699" y="158" font-size="13" fill="#625b45">朋友圈、口播与改稿</text>
<path d="M 881 127 h 12 m -5 -5 5 5 -5 5" fill="none" stroke="#a59242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="900" y="59" width="192" height="137" rx="12" fill="#ffd400" stroke="#dfba00"/>
<rect x="912" y="74" width="32" height="25" rx="6" fill="#ffd400"/>
<text x="917" y="92" font-size="14" font-weight="700" fill="#24221c">05</text>
<text x="917" y="126" font-size="17" font-weight="600" fill="#24221c">保存并继续积累</text>
<text x="917" y="158" font-size="13" fill="#625b45">按你的具体授权执行</text>
</g>
</svg>
